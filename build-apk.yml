name: Build MarketOS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "app/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          if [ -f "android/gradlew" ]; then
            echo "project_dir=android" >> "$GITHUB_OUTPUT"
          elif [ -f "gradlew" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find gradlew. Upload the extracted Android project files (not just the ZIP)."
            echo "Expected gradlew at repository root or inside android/."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketOS-debug-APK
          path: |
            ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.locate.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
